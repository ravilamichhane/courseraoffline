[package]
name = "courseviewer"
version = "0.1.0"
edition = "2024"
default-run = "courseviewer"

[dependencies]
actix-web = "4"
connectrpc = "0.9.1"
buffa = { version = "0.9.1", features = ["json"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3"
